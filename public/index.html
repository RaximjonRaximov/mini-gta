<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini GTA</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game">
    <canvas id="canvas"></canvas>
    <div id="hud">
      <div id="speed">0 km/h</div>
      <div id="wanted">WANTED: <span id="wanted-level">0</span></div>
      <div id="mission">Mission: <span id="mission-text">Find the car (E to enter)</span></div>
      <div id="help">WASD move / drive · E enter/exit car · Space brake</div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
